# Publishes a GitHub Release ONLY when a pull request from a branch named
# release/X.Y.Z is merged into main. Nothing else (pushes, tags, other
# branches, closed-but-unmerged PRs) can trigger a release.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Check version
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          version="${HEAD_REF#release/}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Branch '$HEAD_REF' is not of the form release/X.Y.Z"
            exit 1
          fi
          cmake_version="$(./scripts/version.sh)"
          if [ "$cmake_version" != "$version" ]; then
            echo "::error::CMakeLists.txt declares $cmake_version but the branch is release/$version. Bump project(VERSION) on the release branch."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  packages:
    name: Packages
    needs: prepare
    uses: ./.github/workflows/packages.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  publish:
    name: Publish GitHub Release
    needs: [prepare, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          cat > notes.md <<EOF
          OpenDM ${VERSION}: GTK3 fork.

          OpenDM was created by **Nader Mahbub Khan** ([nadermkhan/opendm](https://github.com/nadermkhan/opendm)). This is a modified fork; see NOTICE and AUTHORS.

          | Distribution | Package |
          |---|---|
          | Ubuntu 22.04+, Debian 12+ and derivatives | \`opendm_${VERSION}-1_amd64.deb\` |
          | Fedora | \`opendm-${VERSION}-1.fc*.x86_64.rpm\` |
          | openSUSE Tumbleweed | \`opendm-${VERSION}-1.suse.x86_64.rpm\` |
          | Arch Linux and derivatives | \`opendm-${VERSION}-1-x86_64.pkg.tar.zst\` |
          | Source RPM | \`opendm-${VERSION}-1.fc*.src.rpm\` |

          Verify downloads with \`sha256sum -c SHA256SUMS\`.
          EOF
          gh release create "v${VERSION}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "OpenDM ${VERSION}" \
            --notes-file notes.md \
            --generate-notes
